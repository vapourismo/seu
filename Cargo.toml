[workspace]
members = [
    "crates/seu-core",
    "crates/seu-macros",
    "crates/seu",
    "crates/seu-serde",
]
resolver = "3"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies.serde]
features = ["derive"]
version = "1.0"

[workspace.dependencies.serde_json]
version = "1.0"

[workspace.dependencies.syn]
features = ["full", "visit-mut"]
version = "3.0"

[workspace.dependencies.quote]
version = "1.0"

[workspace.dependencies.proc-macro2]
version = "1.0"

[workspace.dependencies.seu-core]
path = "crates/seu-core"

[workspace.dependencies.seu-macros]
path = "crates/seu-macros"

[workspace.dependencies.seu]
path = "crates/seu"

[workspace.dependencies.seu-serde]
path = "crates/seu-serde"
